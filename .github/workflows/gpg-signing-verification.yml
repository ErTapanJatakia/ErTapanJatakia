name: Verify Personal GPG Commit Signing

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-gpg-signing-verification
  cancel-in-progress: false

jobs:
  verify-signing:
    name: Create and mirror a signed verification commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import personal signing key and configure Git
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"

          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ] || [ -z "$GPG_SIGNING_KEY" ]; then
            echo "::error::One or more required GPG Actions secrets are missing."
            exit 1
          fi

          printf '%s' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/signing-key.asc"
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
          chmod 600 "$RUNNER_TEMP/signing-key.asc" "$RUNNER_TEMP/gpg-passphrase"

          gpg --batch --import "$RUNNER_TEMP/signing-key.asc"
          rm -f "$RUNNER_TEMP/signing-key.asc"

          cat > "$RUNNER_TEMP/gpg-wrapper" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/gpg-passphrase" "$@"
          WRAPPER
          chmod 700 "$RUNNER_TEMP/gpg-wrapper"

          git config user.name "ErTapanJatakia"
          git config user.email "tapan_ditu_17.20@outlook.com"
          git config user.signingkey "$GPG_SIGNING_KEY"
          git config commit.gpgsign true
          git config gpg.program "$RUNNER_TEMP/gpg-wrapper"

          gpg --batch --list-secret-keys "$GPG_SIGNING_KEY" >/dev/null
          echo "Personal signing key imported and available."

      - name: Create a signed, content-neutral verification commit
        run: |
          set -euo pipefail
          git commit --allow-empty -S -m "chore: verify personal GPG commit signing"
          git verify-commit HEAD
          echo "Signed verification commit created and locally verified."

      - name: Configure GitVerse SSH authentication
        env:
          GITVERSE_SSH_PRIVATE_KEY: ${{ secrets.GITVERSE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GITVERSE_SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing repository secret GITVERSE_SSH_PRIVATE_KEY."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$GITVERSE_SSH_PRIVATE_KEY" > ~/.ssh/gitverse_ed25519
          chmod 600 ~/.ssh/gitverse_ed25519

          cat > ~/.ssh/known_hosts <<'EOF'
          gitverse.ru ssh-rsa 
          EOF
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host gitverse.ru
            HostName gitverse.ru
            User git
            IdentityFile ~/.ssh/gitverse_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Push signed commit to GitHub and GitVerse
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/main
          git remote add gitverse git@gitverse.ru:ErTapanJatakia/ErTapanJatakia.git
          git push gitverse HEAD:refs/heads/main

      - name: Remove temporary passphrase material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gpg-passphrase" "$RUNNER_TEMP/signing-key.asc" "$RUNNER_TEMP/gpg-wrapper"
          rm -rf "$RUNNER_TEMP/gnupg"
