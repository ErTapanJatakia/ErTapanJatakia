name: Repository Dependency Graph SBOM

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 1 * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "config/**"

permissions: {}

concurrency:
  group: repository-dependency-sbom
  cancel-in-progress: false

jobs:
  export-sbom:
    name: Export and validate SPDX dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Request GitHub Dependency Graph SBOM generation
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/sbom-generation-response.json"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --request GET \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GH_REPOSITORY/dependency-graph/sbom/generate-report" \
            --output "$response"
          sbom_url="$(jq --exit-status --raw-output '.sbom_url' "$response")"
          if [[ "$sbom_url" != https://api.github.com/repos/*/dependency-graph/sbom/fetch-report/* ]]; then
            echo "::error::GitHub returned an unexpected SBOM report URL."
            exit 1
          fi
          echo "sbom_url=$sbom_url" >> "$GITHUB_OUTPUT"

      - name: Wait for SPDX report and download it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM_URL: ${{ steps.request.outputs.sbom_url }}
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/sbom-response-headers.txt"
          response="$RUNNER_TEMP/sbom-response-body.json"
          download_url=""
          for attempt in {1..18}; do
            status="$(curl --silent --show-error --proto '=https' --tlsv1.2 \
              --dump-header "$headers" \
              --output "$response" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "$SBOM_URL")"
            if [[ "$status" == "302" ]]; then
              download_url="$(awk 'tolower($1) == "location:" { sub(/\r$/, ""); $1=""; sub(/^ /, ""); print }' "$headers" | tail -n 1)"
              break
            fi
            if [[ "$status" != "202" ]]; then
              echo "::error::Unexpected SBOM report response: HTTP $status"
              cat "$response"
              exit 1
            fi
            echo "SBOM report is still processing (attempt $attempt/18)."
            sleep 10
          done
          if [[ -z "$download_url" ]]; then
            echo "::error::SBOM report did not become ready within three minutes."
            exit 1
          fi
          mkdir -p dist
          # The signed temporary download URL is separate from the authenticated API endpoint.
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --location "$download_url" \
            --output dist/repository-dependency-sbom.spdx.json

      - name: Validate SPDX document and dependency coverage
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          sbom="dist/repository-dependency-sbom.spdx.json"
          jq --exit-status '
            (.sbom // .) as $document |
            $document.SPDXID == "SPDXRef-DOCUMENT" and
            $document.spdxVersion == "SPDX-2.3" and
            ($document.packages | type == "array") and
            ($document.relationships | type == "array")
          ' "$sbom" >/dev/null
          package_count="$(jq '(.sbom // .).packages | length' "$sbom")"
          dependency_count="$(jq '[((.sbom // .).relationships)[] | select(.relationshipType == "DEPENDS_ON")] | length' "$sbom")"
          if (( dependency_count < 1 )); then
            echo "::notice::GitHub Dependency Graph returned a valid SPDX document with no DEPENDS_ON relationships. The artifact will be retained as an empty graph snapshot, not represented as evidence of populated dependency coverage."
          fi
          sha256sum "$sbom" > "$sbom.sha256"
          {
            echo "## Repository Dependency Graph SBOM"
            echo
            echo "- Format: SPDX 2.3"
            echo "- Package records: $package_count"
            echo "- Dependency relationships: $dependency_count"
            echo "- Scope: GitHub Dependency Graph only; this is not a full filesystem, container or binary inventory."
            echo "- SHA-256: $(cut -d ' ' -f 1 "$sbom.sha256")"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Validated SPDX 2.3 SBOM with $package_count package records and $dependency_count dependency relationships."

      - name: Generate SBOM artifact provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/repository-dependency-sbom.spdx.json
            dist/repository-dependency-sbom.spdx.json.sha256

      - name: Verify SBOM artifact provenance attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_subject() {
            local subject="$1"
            local result error
            result="$RUNNER_TEMP/attestation-$(basename "$subject").json"
            error="$RUNNER_TEMP/attestation-$(basename "$subject").err"
            for attempt in {1..6}; do
              if gh attestation verify "$subject" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "github.com/$GITHUB_REPOSITORY/.github/workflows/repository-dependency-sbom.yml" \
                --format json > "$result" 2> "$error"; then
                jq --exit-status 'length > 0' "$result" >/dev/null
                echo "Verified provenance attestation for $subject."
                return 0
              fi
              echo "Attestation is not yet available for $subject (attempt $attempt/6)."
              sleep 5
            done
            cat "$error" >&2
            echo "::error::Could not verify the provenance attestation for $subject."
            return 1
          }

          verify_subject "dist/repository-dependency-sbom.spdx.json"
          verify_subject "dist/repository-dependency-sbom.spdx.json.sha256"
          {
            echo
            echo "- Provenance: Sigstore-backed GitHub artifact attestations generated and verified for the SPDX SBOM and its SHA-256 checksum."
            echo "- Attestation scope: the generated SBOM and checksum files only; this is not software build provenance."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SPDX SBOM artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: repository-dependency-sbom-${{ github.run_id }}
          path: |
            dist/repository-dependency-sbom.spdx.json
            dist/repository-dependency-sbom.spdx.json.sha256
          if-no-files-found: error
          retention-days: 30
