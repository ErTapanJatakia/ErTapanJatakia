name: Repository Quality Assurance

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: repository-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Markdown documentation
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            **/*.md
            !README.md
            !LICENSE

  yaml-validation:
    name: YAML syntax validation (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse repository YAML and action metadata
        shell: bash
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            files = Dir.glob("{.github/**/*.yml,.github/**/*.yaml}").sort
            abort "No repository YAML files found" if files.empty?
            files.each do |file|
              YAML.parse_file(file)
              puts "Valid YAML: #{file}"
            end
          '

  link-validation:
    name: Markdown link validation (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --verbose --no-progress './**/*.md'
          lycheeVersion: v0.24.2

  actionlint:
    name: GitHub Actions static analysis (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified actionlint release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -version

      - name: Analyze GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          # actionlint v1.7.12 predates GitHub's July 2026 self-repository
          # action syntax. Exclude only the exact documented local-action false-positive.
          "$RUNNER_TEMP/actionlint/actionlint" -color \
            -ignore 'specifying action .*setup-personal-gpg.* in invalid format because ref is missing' \
            -ignore 'unknown permission scope "vulnerability-alerts"' \
            .github/workflows/*.yml

  prettier:
    name: Prettier configuration formatting (advisory)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check repository configuration formatting
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.6.2 --check \
            ".github/workflows/*.yml" \
            ".github/dependabot.yml" \
            ".prettierrc.json"

  vex-validation:
    name: VEX register validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate VEX exceptions and CycloneDX statements
        run: ruby scripts/validate-vex.rb

      - name: Test VEX validator positive and negative cases
        run: ruby tests/vex_validator_test.rb

  major-change-validation:
    name: Major change validation
    if: always()
    needs:
      - markdown-lint
      - yaml-validation
      - link-validation
      - actionlint
      - prettier
      - vex-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce QA completion for major changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "No pull-request change classification is required for this event."
            exit 0
          fi

          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          major_change=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|.github/actions/*|.github/dependabot-vex-exceptions.json|config/*|docs/*POLICY*|docs/ACCESS-GOVERNANCE.md|docs/THREAT-MODEL.md|docs/VEX-PROCESS.md|docs/OPENSSF-BASELINE-L3-IMPLEMENTATION.md|docs/RELEASE-*|docs/DEPENDENCY-*|docs/vex/*|docs/access-reviews/*|scripts/*|tests/*|.editorconfig)
                major_change=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"

          if [[ "$major_change" != "true" ]]; then
            echo "No security-sensitive or major-change paths were modified."
            exit 0
          fi

          echo "Major/security-sensitive change detected; verifying all relevant QA jobs."
          for job in markdown-lint yaml-validation link-validation actionlint prettier vex-validation; do
            if ! jq -e --arg name "$job" '.[$name].result == "success"' <<< "$NEEDS_JSON" >/dev/null; then
              echo "::error::Required QA job did not succeed for this major change: $job"
              jq -r --arg name "$job" '.[$name].result // "missing"' <<< "$NEEDS_JSON"
              exit 1
            fi
          done
          echo "All required repository QA and VEX tests passed for this major change."
