name: Signed Publish to GitHub and GitVerse

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Staging branch to publish (must start with staging/)"
        required: true
        type: string
      commit_message:
        description: "Commit message for the signed publication commit"
        required: true
        default: "chore: publish signed update"
        type: string

permissions:
  contents: write

concurrency:
  group: signed-publish-main
  cancel-in-progress: false

jobs:
  signed-publish:
    name: Sign, verify, and publish to both remotes
    runs-on: ubuntu-latest
    env:
      GNUPGHOME: ${{ runner.temp }}/personal-gpg
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and fetch staging branch
        id: source
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_BRANCH" =~ ^staging/[A-Za-z0-9._/-]+$ ]] ||
             ! git check-ref-format "refs/heads/$SOURCE_BRANCH"; then
            echo "::error::Source branch must be a valid staging/* branch."
            exit 1
          fi

          if [[ "$SOURCE_BRANCH" == *".."* || "$SOURCE_BRANCH" == *"//"* ||
                "$SOURCE_BRANCH" == */ || "$SOURCE_BRANCH" == *".lock" ]]; then
            echo "::error::Source branch contains a disallowed ref pattern."
            exit 1
          fi

          if [[ -z "${COMMIT_MESSAGE//[[:space:]]/}" ]] || [[ ${#COMMIT_MESSAGE} -gt 200 ]]; then
            echo "::error::Commit message must be non-empty and no longer than 200 characters."
            exit 1
          fi

          git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          SOURCE_REF="refs/remotes/origin/$SOURCE_BRANCH"

          if ! git merge-base --is-ancestor origin/main "$SOURCE_REF"; then
            echo "::error::Staging branch must be based on the current main branch. Recreate it from the latest main and reapply your changes."
            exit 1
          fi

          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

      - name: Configure personal GPG signing
        uses: ./.github/actions/setup-personal-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          signing-key: ${{ secrets.GPG_SIGNING_KEY }}
          git-name: Er. Tapan Jatakia
          git-email: tapan_ditu_17.20@outlook.com

      - name: Prepare a single signed publication commit
        env:
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          git switch --detach origin/main
          git merge --squash --no-commit "$SOURCE_REF"

          if git diff --cached --quiet; then
            echo "::error::The staging branch contains no changes to publish."
            exit 1
          fi

          git commit -S -m "$COMMIT_MESSAGE"
          git verify-commit HEAD
          echo "Personal GPG signature verified. Commit: $(git rev-parse HEAD)"

      - name: Configure GitVerse SSH authentication
        env:
          GITVERSE_SSH_PRIVATE_KEY: ${{ secrets.GITVERSE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GITVERSE_SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing repository secret GITVERSE_SSH_PRIVATE_KEY."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$GITVERSE_SSH_PRIVATE_KEY" > ~/.ssh/gitverse_ed25519
          chmod 600 ~/.ssh/gitverse_ed25519

          cat > ~/.ssh/known_hosts <<'EOF'
          gitverse.ru ssh-rsa 
          EOF
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host gitverse.ru
            HostName gitverse.ru
            User git
            IdentityFile ~/.ssh/gitverse_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Publish the identical signed commit to GitHub and GitVerse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/main
          git remote add gitverse git@gitverse.ru:ErTapanJatakia/ErTapanJatakia.git
          git push gitverse HEAD:refs/heads/main

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/personal-gpg-passphrase" \
                "$RUNNER_TEMP/personal-gpg-private.asc" \
                "$RUNNER_TEMP/personal-gpg-wrapper" \
                ~/.ssh/gitverse_ed25519
          rm -rf "$RUNNER_TEMP/personal-gpg"
