name: Signed Publish via Pull Request

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Staging branch to submit (must start with staging/)"
        required: true
        type: string
      commit_message:
        description: "Commit message for the signed publication commit"
        required: true
        default: "chore: publish signed update"
        type: string

permissions: {}

concurrency:
  group: signed-publish-pr
  cancel-in-progress: false

jobs:
  signed-publish:
    name: Sign changes and open a publication pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and fetch staging branch
        id: source
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_BRANCH" =~ ^staging/[A-Za-z0-9._/-]+$ ]] ||
             ! git check-ref-format "refs/heads/$SOURCE_BRANCH"; then
            echo "::error::Source branch must be a valid staging/* branch."
            exit 1
          fi

          if [[ "$SOURCE_BRANCH" == *".."* || "$SOURCE_BRANCH" == *"//"* ||
                "$SOURCE_BRANCH" == */ || "$SOURCE_BRANCH" == *".lock" ]]; then
            echo "::error::Source branch contains a disallowed ref pattern."
            exit 1
          fi

          if [[ -z "${COMMIT_MESSAGE//[[:space:]]/}" ]] ||
             [[ ${#COMMIT_MESSAGE} -gt 200 ]] ||
             [[ "$COMMIT_MESSAGE" =~ [[:cntrl:]] ]] ||
             [[ "$COMMIT_MESSAGE" == [[:space:]]* ]] ||
             [[ "$COMMIT_MESSAGE" == *[[:space:]] ]]; then
            echo "::error::Commit message must be a single-line printable value, 1–200 characters, without leading or trailing whitespace."
            exit 1
          fi

          git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          SOURCE_REF="refs/remotes/origin/$SOURCE_BRANCH"

          if ! git merge-base --is-ancestor origin/main "$SOURCE_REF"; then
            echo "::error::Staging branch must be based on current main. Recreate it from latest main and reapply changes."
            exit 1
          fi

          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse "$SOURCE_REF")" >> "$GITHUB_OUTPUT"

      - name: Configure personal GPG signing
        uses: $/.github/actions/setup-personal-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          signing-key: ${{ secrets.GPG_SIGNING_KEY }}
          git-name: Er. Tapan Jatakia
          git-email: tapan_ditu_17.20@outlook.com

      - name: Prepare and verify a signed publication commit
        env:
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          git switch --detach origin/main
          git merge --squash --no-commit "$SOURCE_REF"

          if git diff --cached --quiet; then
            echo "::error::The staging branch contains no changes to publish."
            exit 1
          fi

          git commit -S -m "$COMMIT_MESSAGE"
          git verify-commit HEAD
          echo "Personal GPG signature verified. Commit: $(git rev-parse HEAD)"

      - name: Push signed publication branch
        id: publish-branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          SAFE_BRANCH="${SOURCE_BRANCH//\//-}"
          PUBLISH_BRANCH="signed-publish/${SAFE_BRANCH}-${SOURCE_SHA:0:12}-${GITHUB_RUN_ID}"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push origin "HEAD:refs/heads/$PUBLISH_BRANCH"
          echo "branch=$PUBLISH_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request for review and merge
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_BRANCH: ${{ steps.publish-branch.outputs.branch }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          BODY="$(printf '%s\\n' '## Signed publication' '' 'This publication branch was created by the signed-publish workflow.' 'Its publication commit was signed with the configured personal GPG key and verified with git verify-commit.' '' "Please review the changes and merge through the repository's protected pull-request process. The GitVerse mirror runs after the merge to main.")"
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f title="$COMMIT_MESSAGE" \
            -f head="$PUBLISH_BRANCH" \
            -f base="main" \
            -f body="$BODY"
