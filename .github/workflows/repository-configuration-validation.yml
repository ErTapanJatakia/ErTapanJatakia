name: Repository Configuration Validation

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: repository-configuration-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse GitHub Actions workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            files = Dir.glob(".github/workflows/*.{yml,yaml}").sort
            abort "No workflow YAML files found" if files.empty?
            files.each do |file|
              YAML.parse_file(file)
              puts "Valid YAML: #{file}"
            end
          '

      - name: Validate EditorConfig policy
        shell: bash
        run: |
          set -euo pipefail
          test -f .editorconfig
          grep -Fxq 'root = true' .editorconfig
          grep -Fxq 'charset = utf-8' .editorconfig
          grep -Fxq 'end_of_line = lf' .editorconfig
          grep -Fxq 'insert_final_newline = true' .editorconfig
          grep -Fxq 'indent_style = space' .editorconfig
          grep -Fxq 'indent_size = 2' .editorconfig
          grep -Fxq 'trim_trailing_whitespace = false' .editorconfig
          echo "EditorConfig policy is present and contains the required repository settings."

      - name: Validate local composite action references
        shell: bash
        run: |
          set -euo pipefail
          action_file=".github/actions/setup-personal-gpg/action.yml"
          release_workflow=".github/workflows/documentation-release.yml"
          publish_workflow=".github/workflows/signed-publish.yml"
          test -f "$action_file"
          grep -Fq "uses: $/.github/actions/setup-personal-gpg" "$release_workflow"
          grep -Fq "uses: $/.github/actions/setup-personal-gpg" "$publish_workflow"
          test -f script/setup
          bash -n script/setup
          echo "The controlled release workflow references an existing local GPG setup action; developer bootstrap syntax is valid."

      - name: Validate README accessibility structure
        shell: bash
        run: |
          set -euo pipefail
          ruby -e '
            content = File.read("README.md")
            images = content.scan(/<img\b[^>]*>/i)
            missing_alt = images.reject { |tag| tag.match?(/\balt\s*=/i) }
            abort "README contains images without alternative text." unless missing_alt.empty?
            levels = content.lines.filter_map do |line|
              match = line.match(/\A(#+)\s/)
              match[1].length if match
            end
            skipped = levels.each_cons(2).any? { |previous, current| current > previous + 1 }
            abort "README heading hierarchy skips a level." if skipped
            puts "README accessibility source checks passed: #{images.length} images have alt text; heading hierarchy is sequential."
          '

      - name: Validate secure network transport defaults
        shell: bash
        run: ruby scripts/validate-network-transport.rb .github/workflows
      - name: Validate repository controller registry
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .version == 1 and
            (.repositories | type == "array") and
            all(.repositories[];
              (.github | type == "string" and test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")) and
              (.branch | type == "string" and length > 0) and
              (.gitverse | type == "string" and test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")) and
              (.enabled | type == "boolean") and
              (.mode == "sign-and-mirror")
            )
          ' config/repositories.json >/dev/null
          echo "Repository controller registry is valid."
