name: Central Signed Repository Controller

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: central-repository-controller
  cancel-in-progress: false

jobs:
  process-enabled-repositories:
    name: Create signed attestation pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out controller configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Validate registry
        run: |
          set -euo pipefail
          jq -e '
            .version == 1 and
            (.repositories | type == "array") and
            all(.repositories[];
              (.github | type == "string" and test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")) and
              (.branch | type == "string" and length > 0) and
              (.gitverse | type == "string" and test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")) and
              (.enabled | type == "boolean") and
              (.mode == "sign-and-mirror")
            )
          ' config/repositories.json >/dev/null
          if jq -e --arg current "$GITHUB_REPOSITORY"             '.repositories[] | select(.enabled == true and .github != $current)'             config/repositories.json >/dev/null; then
            echo "::error::This controller uses the repository-scoped GITHUB_TOKEN. Enabled registry entries must target $GITHUB_REPOSITORY."
            exit 1
          fi
          echo "Repository registry is valid and limited to this repository."

      - name: Configure personal GPG signing
        uses: $/.github/actions/setup-personal-gpg
        with:
          private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          signing-key: ${{ secrets.GPG_SIGNING_KEY }}
          git-name: Er. Tapan Jatakia
          git-email: tapan_ditu_17.20@outlook.com

      - name: Create signed attestation pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          mkdir -p "$RUNNER_TEMP/repository-work"

          while IFS= read -r entry; do
            repo="$(jq -r '.github' <<<"$entry")"
            branch="$(jq -r '.branch' <<<"$entry")"
            printf '::group::Checking %s (%s)\n' "$repo" "$branch"

            open_pr_count="$(gh pr list --repo "$repo" --state open --json headRefName               --jq '[.[] | select(.headRefName | startswith("automation/signed-attestation-"))] | length')"
            if [[ "$open_pr_count" -gt 0 ]]; then
              echo "A signed-attestation pull request is already open; leaving it for review."
              printf '::endgroup::\n'
              continue
            fi

            workdir="$RUNNER_TEMP/repository-work/repository"
            rm -rf "$workdir"
            git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER"               clone --no-tags "https://github.com/$repo.git" "$workdir"
            git -C "$workdir" fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git -C "$workdir" switch --detach "refs/remotes/origin/$branch"

            if git -C "$workdir" verify-commit HEAD >/dev/null 2>&1; then
              echo "Current HEAD has a verifiable commit signature; no attestation PR is needed."
              printf '::endgroup::\n'
              continue
            fi

            source_sha="$(git -C "$workdir" rev-parse --short=12 HEAD)"
            safe_branch="$(printf '%s' "$branch" | tr '/' '-')"
            automation_branch="automation/signed-attestation-$safe_branch-$source_sha-$GITHUB_RUN_ID"

            git -C "$workdir" config user.name "Er. Tapan Jatakia"
            git -C "$workdir" config user.email "tapan_ditu_17.20@outlook.com"
            git -C "$workdir" config user.signingkey "$GPG_SIGNING_KEY"
            git -C "$workdir" config commit.gpgsign true
            git -C "$workdir" config gpg.program "$RUNNER_TEMP/personal-gpg-wrapper"

            git -C "$workdir" switch -c "$automation_branch"
            attestation_dir="$workdir/.github/attestations"
            mkdir -p "$attestation_dir"
            printf '%s\n' '# GPG signature attestation' '' "- Repository: $repo" "- Target branch: $branch" "- Target commit: $source_sha" "- Attestation created: $(date -u +%Y-%m-%dT%H:%M:%SZ)" '- Signing identity: configured repository-owner GPG key' '' 'This record documents that the target commit was reviewed by the signing controller and that a separate attestation commit was signed with the configured personal GPG key. The attestation commit signature is verified with git verify-commit.' > "$attestation_dir/$source_sha.md"
            git -C "$workdir" add ".github/attestations/$source_sha.md"
            git -C "$workdir" commit -S -m "chore: add verified GPG attestation for $source_sha"
            git -C "$workdir" verify-commit HEAD

            git -C "$workdir" -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin "HEAD:refs/heads/$automation_branch"

            gh api --method POST "repos/$repo/pulls" \
              -f title="chore: add verified GPG attestation for $source_sha" \
              -f head="$automation_branch" \
              -f base="$branch" \
              -f body="$(printf '%s\\n' '## Signed attestation' '' "This pull request adds a transparent attestation record for commit $source_sha." '' 'The attestation commit is signed with the configured personal GPG key and verified with git verify-commit. It does not alter application source code.' '' 'Please review and merge through the repository pull-request process. The GitVerse mirror runs after the merge to the target branch.')"

            echo "Created signed attestation PR for $repo:$branch."
            printf '::endgroup::\n'
          done < <(jq -c '.repositories[] | select(.enabled == true)' "$GITHUB_WORKSPACE/config/repositories.json")

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/personal-gpg-passphrase"                 "$RUNNER_TEMP/personal-gpg-private.asc"                 "$RUNNER_TEMP/personal-gpg-wrapper"
          rm -rf "$HOME/.gnupg" "$RUNNER_TEMP/repository-work"
